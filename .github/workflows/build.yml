name: Build and Test Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Enables manual run button in GitHub web and mobile app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write local.properties
        run: echo "TMDB_READ_ACCESS_TOKEN=${{ secrets.TMDB_READ_ACCESS_TOKEN }}" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version=8.13

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Dedicated Integration Tests
        run: ./gradlew testDebugUnitTest --tests "com.onedebrid.app.provider.MediaDiscoveryIntegrationTest"

      - name: Build debug APK
        run: ./gradlew assembleDebug
