# AndroidX - required for all modern Android dependencies
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables Gradle build cache for faster incremental builds
org.gradle.caching=true

# Allows Gradle configuration cache
org.gradle.configuration-cache=true

# Increases JVM heap for large projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8